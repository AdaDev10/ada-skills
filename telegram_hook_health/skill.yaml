  rationale: 'The corpus shows the same hook failure modes repeating on 2026-11-13: Ada''s own-post guard using msg.out and sender_id skipped every Office message on the shared Tim account, the hook died at 08:07 EST with AuthKeyDuplicatedError after a second Telethon client was opened alongside it, and Vera missed the team test (Office 38757) with a file-watch hook that overwrote pending.json and re-woke 98 times on one message (Office 38821, repair steps Office 38822). The proven fixes are the recorded-id guard, the watchdog that counts success only on state-file advance with a live kill test passing in about 2 minutes, and Lucy making state-file proof the team rule (Office 38818). No existing skill covers this: muse.skill_search for telegram hook watchdog health returned only unrelated health and flight skills, and muse.connector_search found no Telegram connector. The method is already half-codified only in a Vera-specific task pack (vera-repair-pack.md), so a clean reusable skill changes future diagnoses. The deterministic handoff-suppression candidates for memory and relationships were rejected as scheduler policy, not skill-addressable, and Bybit was not proposed because its method is already documented in trader-broker/BYBIT.md.'
